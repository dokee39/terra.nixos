name: "[upstream:nixpkgs_version] unblock once nixpkgs ships a package version"
description: Track a local override blocked on nixpkgs shipping a required package version on a channel.
title: "[upstream:nixpkgs_version] <type>(<scope>): <action> once <attr> <op> <version> on <channel>"
labels:
  - "upstream:nixpkgs_version"
body:
  - type: textarea
    id: params
    attributes:
      label: Parameters
      description: Do not edit the comment below; the scanner reads it.
      value: |
        <!--
        upstream-check:
          attr: <attr path, e.g. envfs or python311Packages.requests>
          channel: <nixpkgs branch, e.g. nixos-unstable or nixos-25.11>
          target: <constraint, e.g. 1.2.0 | >= 1.2.0 | > 1.0.0>
        -->
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Affected files
      description: One path or permalink per line.
    validations:
      required: true
  - type: textarea
    id: checklist
    attributes:
      label: Checklist
      value: |
        - [ ] channel ships the required version
        - [ ] local override verified removable
        - [ ] all affected hosts rebuild cleanly
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Why this version is needed and what the local override does.
