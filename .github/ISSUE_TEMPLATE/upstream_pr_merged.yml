name: "[upstream:pr_merged] unblock once upstream PR merges"
description: Track a local override blocked on an upstream GitHub PR being merged.
title: "[upstream:pr_merged] <type>(<scope>): <action> once PR #<n> merges"
labels:
  - "upstream:pr_merged"
body:
  - type: textarea
    id: params
    attributes:
      label: Parameters
      description: Do not edit the comment below; the scanner reads it.
      value: |
        <!--
        upstream-check:
          repo: <owner/name>
          number: <PR number>
        -->
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Affected files
      description: One path or permalink per line.
    validations:
      required: true
  - type: textarea
    id: checklist
    attributes:
      label: Checklist
      value: |
        - [ ] upstream PR is merged
        - [ ] local override verified removable
        - [ ] all affected hosts rebuild cleanly
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: What the PR fixes and what the local override does.
