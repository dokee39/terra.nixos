name: "[upstream:release_version] unblock once an upstream release matches a version"
description: Track a local override blocked on an upstream release tag satisfying a version constraint.
title: "[upstream:release_version] <type>(<scope>): <action> once <repo> <op> <version>"
labels:
  - "upstream:release_version"
body:
  - type: textarea
    id: params
    attributes:
      label: Parameters
      description: Do not edit the comment below; the scanner reads it.
      value: |
        <!--
        upstream-check:
          repo: <owner/name>
          target: <constraint, e.g. 1.2.0 | >= 1.2.0 | > 1.0.0>
        -->
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Affected files
      description: One path or permalink per line.
    validations:
      required: true
  - type: textarea
    id: checklist
    attributes:
      label: Checklist
      value: |
        - [ ] upstream release matches the version constraint
        - [ ] local override verified removable
        - [ ] all affected hosts rebuild cleanly
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Why this release is needed and what the local override does.
