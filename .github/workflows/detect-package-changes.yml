name: detect-package-changes

on:
  push:
    paths: [flake.lock]

permissions:
  contents: read
  issues: write

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ github.token }}

      - name: Validate configuration
        run: nix flake check .github/tests/test-flake

      - name: Detect package changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git rev-parse HEAD~1 >/dev/null 2>&1; then
            echo "Only one commit in history. Skipping diff."
            exit 0
          fi
          pip install pyyaml --quiet
          python3 .github/scripts/detect-package-changes.py
