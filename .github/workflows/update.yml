name: update

on:
  schedule:
    - cron: 7 20 * * 6
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ github.token }}

      - name: Configure Git identity
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Checkpoint current state
        run: |
          git add flake.lock sources.json
          git commit --allow-empty -m "checkpoint"

      - name: Update external sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update-sources.py

      - run: nix flake update

      - name: Validate root flake
        run: nix flake check --all-systems

      - name: Report flake errors
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --label bug \
            --title "[bot][$(date +%F)] Update Failed" \
            --body "Auto-update failed validation. See workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Generate changelog
        run: |
          git add flake.lock sources.json
          if git diff --cached --quiet; then
            git reset --soft HEAD~1
            exit 0
          fi
          git commit -m "update-checkpoint"
          python3 scripts/detect-package-changes.py \
            --diff HEAD~1 HEAD \
            --plain \
            > /tmp/commit-body.md
          git reset --soft HEAD~2

      - name: Commit and push updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add flake.lock sources.json
          git diff --cached --quiet && exit 0
          body=$(cat /tmp/commit-body.md)
          title_parts=""
          git diff --cached --name-only | grep -q '^sources\.json$' && title_parts="${title_parts} and sources"
          git diff --cached --name-only | grep -q -E '(^|/)flake\.lock$' && title_parts="flake.lock${title_parts}"
          [ -z "$title_parts" ] && title_parts="dependencies"
          if [ -n "$body" ]; then
            git commit -m "chore(deps): update ${title_parts}" -m "$body"
          else
            git commit -m "chore(deps): update ${title_parts}"
          fi
          git push origin HEAD:${{ github.ref_name }}
          gh workflow run detect-package-changes.yml \
            --ref "${{ github.ref_name }}"
