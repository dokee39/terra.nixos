name: upstream-check
on:
  push:
    paths:
      - '.github/scripts/upstream_check/**'
      - '.github/workflows/upstream-check.yml'
  schedule:
    - cron: "0 0 * * 3,6"
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: false
permissions:
  issues: write
  contents: read
concurrency:
  group: upstream-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --no-input pyyaml==6.0.3 requests==2.34.2 packaging==26.2
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
          UPSTREAM_CHECK_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python .github/scripts/upstream_check/main.py
