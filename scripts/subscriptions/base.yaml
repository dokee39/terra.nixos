port: 7890
socks-port: 7891
allow-lan: false
mode: rule
log-level: info
external-controller: 127.0.0.1:9090
unified-delay: true

dns:
  enable: true
  use-hosts: true
  default-nameserver:
    - 119.29.29.29
    - 223.5.5.5
    - 223.6.6.6
    - 114.114.114.114
    - 8.8.8.8
    - tls://223.5.5.5
    - tls://223.6.6.6
    - tls://1.12.12.12
    - tls://120.53.53.53
  nameserver:
    - 119.29.29.29
    - 223.5.5.5
    - tls://223.5.5.5
    - tls://223.6.6.6
    - tls://dot.pub
    - tls://1.12.12.12
    - tls://120.53.53.53

proxy-groups:
  - name: ⚡ 自动切换-日本
    type: url-test
    include-all-proxies: true
    filter: 日本
    exclude-filter: 免费|下载专用
    url: https://www.gstatic.com/generate_204
    expected-status: 204
    interval: 120
    tolerance: 100
    lazy: false
    timeout: 2000
    max-failed-times: 3
  - name: ⚡ 自动切换-香港
    type: url-test
    include-all-proxies: true
    filter: 香港
    exclude-filter: 免费|下载专用
    url: https://www.gstatic.com/generate_204
    expected-status: 204
    interval: 120
    tolerance: 100
    lazy: false
    timeout: 2000
    max-failed-times: 3
  - name: ⚡ 自动切换
    type: fallback
    proxies: [⚡ 自动切换-日本, ⚡ 自动切换-香港]
    url: https://www.gstatic.com/generate_204
    expected-status: 204
    interval: 120
    lazy: false
    timeout: 2000
    max-failed-times: 3

  - name: 🔰 选择节点
    type: select
    proxies: [⚡ 自动切换, ⚡ 自动切换-日本, ⚡ 自动切换-香港, DIRECT]

  - name: 📺 动画疯
    type: select
    proxies: [🔰 选择节点, DIRECT]

  - name: 🚀 测速
    type: select
    proxies: [DIRECT, 🔰 选择节点]
  - name: 🎮 游戏下载
    type: select
    proxies: [DIRECT, 🔰 选择节点]
  - name: 🎮 Steam 商店/社区
    type: select
    proxies: [🔰 选择节点, DIRECT]
  - name: ☁️ OneDrive
    type: select
    proxies: [🔰 选择节点, DIRECT]
  - name: 🇨🇳 国内网站
    type: select
    proxies: [DIRECT, 🔰 选择节点]
  - name: 🛑 拦截广告
    type: select
    proxies: [REJECT, DIRECT, 🔰 选择节点]

