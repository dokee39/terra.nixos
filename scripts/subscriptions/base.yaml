rules:
  - RULE-SET,reject_non_ip_drop,🛑 拦截广告
  - RULE-SET,reject_domain,🛑 拦截广告
  - RULE-SET,reject_extra,🛑 拦截广告
  - RULE-SET,sogouinput,🛑 拦截广告
  - RULE-SET,reject_non_ip,🛑 拦截广告
  - RULE-SET,reject_non_ip_no_drop,🛑 拦截广告

  # Academic services must precede generic CDN routing.
  - RULE-SET,lan_non_ip,DIRECT
  - RULE-SET,direct_non_ip,DIRECT
  - RULE-SET,speedtest,🚀 测速

  - RULE-SET,bahamut,📺 动画疯
  - RULE-SET,stream_non_ip,🔰 选择节点
  - RULE-SET,ai_non_ip,🔰 选择节点
  - RULE-SET,telegram_non_ip,🔰 选择节点
  - RULE-SET,apple_intelligence,🔰 选择节点

  - RULE-SET,apple_cn,🇨🇳 国内网站
  - RULE-SET,domestic_non_ip,🇨🇳 国内网站
  - RULE-SET,apple_cdn,🇨🇳 国内网站
  - RULE-SET,microsoft_cdn,🇨🇳 国内网站

  # Game downloads precede Steam; OneDrive precedes generic downloads.
  - RULE-SET,game_download,🎮 游戏下载
  - RULE-SET,steam,🎮 Steam 商店/社区
  - RULE-SET,onedrive,☁️ OneDrive
  - RULE-SET,cdn_domain,🔰 选择节点
  - RULE-SET,download_domain,🔰 选择节点
  - RULE-SET,cdn_non_ip,🔰 选择节点
  - RULE-SET,download_non_ip,🔰 选择节点
  - RULE-SET,microsoft,🔰 选择节点
  - RULE-SET,global_non_ip,🔰 选择节点

  # Defer IP routing until after domain classification.
  # Reject multicast before LAN, which includes 224.0.0.0/4.
  - IP-CIDR,224.0.0.0/4,REJECT,no-resolve
  - RULE-SET,lan_ip,DIRECT
  - RULE-SET,stream_ip,🔰 选择节点
  - RULE-SET,cdn_ip,🔰 选择节点
  - RULE-SET,download_ip,🔰 选择节点
  - RULE-SET,ai_ip,🔰 选择节点
  - RULE-SET,telegram_ip,🔰 选择节点
  - RULE-SET,domestic_ip,🇨🇳 国内网站
  - RULE-SET,china_ip,🇨🇳 国内网站
  - RULE-SET,china_ip_ipv6,🇨🇳 国内网站

  - MATCH,🔰 选择节点
